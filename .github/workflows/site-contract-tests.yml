name: Site contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.xml'
      - '**.mjs'
      - '.github/workflows/site-contract-tests.yml'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.xml'
      - '**.mjs'
      - '.github/workflows/site-contract-tests.yml'

permissions:
  contents: read

concurrency:
  group: site-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site source (immutable action pin)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check site contracts and all local modules
        run: |
          node --version
          node --test tests/*.test.mjs
